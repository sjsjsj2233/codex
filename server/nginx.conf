# ---------------------------------------------------------
# 1. auto-network.co.kr (192.168.0.130 Gateway)
# ---------------------------------------------------------
server {
    listen 80;
    server_name auto-network.co.kr www.auto-network.co.kr;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name auto-network.co.kr www.auto-network.co.kr;

    ssl_certificate     /etc/letsencrypt/live/auto-network.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auto-network.co.kr/privkey.pem;

    client_max_body_size 100M;

    # ── 라이센스 API (192.168.0.130:8765) ──────────────────────
    location /api/ {
        proxy_pass         http://192.168.0.130:8765/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health {
        proxy_pass http://192.168.0.130:8765/health;
    }

    # ── Jarvis (192.168.0.153:8080) ────────────────────────────
    location /jarvis/ {
        proxy_pass         http://192.168.0.153:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering    off;

        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https: wss://auto-network.co.kr;";
    }

    # ── WebSocket (192.168.0.153:18789) ────────────────────────
    location /ws {
        proxy_pass         http://192.168.0.153:18789;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }

    # ── 메인 백엔드 (192.168.0.130:5000) ───────────────────────
    location / {
        proxy_pass         http://192.168.0.130:5000;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}


